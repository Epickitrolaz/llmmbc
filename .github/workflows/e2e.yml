name: Docker E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/**'
      - 'docker/**'
      - 'scripts/**'
      - 'native/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-e2e:
    name: Docker cluster E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Check integration prerequisites
        id: prereq
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/fetch_engine.sh ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Docker E2E: scripts/fetch_engine.sh (engine stream) is not merged yet"
            exit 0
          fi
          if [ ! -f packages/llmmbc_core/bin/llmmbc_node.dart ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Docker E2E: the headless CLI (core-net) is not merged yet"
            exit 0
          fi
          cd packages/llmmbc_core
          dart pub get
          if ! out=$(dart run bin/llmmbc_node.dart hw); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Docker E2E: llmmbc_node is not functional yet (hw exited non-zero)"
            exit 0
          fi
          if [[ "${out}" != \{* ]] || ! grep -q '"totalRamBytes"' <<<"${out}"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Docker E2E: llmmbc_node hw did not print HardwareProfile JSON"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Restore model cache
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: docker/e2e/.cache
          key: e2e-models-qwen3-0.6b-granite3.1-moe-1b
          restore-keys: |
            e2e-models-
      - name: Run Docker E2E
        if: steps.prereq.outputs.ready == 'true'
        run: docker/e2e/run.sh
      - name: Save container logs
        if: failure() && steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          docker compose -f docker/e2e/compose.yaml logs --no-color > docker/e2e/e2e-logs.txt || true
      - name: Upload logs
        if: failure() && steps.prereq.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: docker/e2e/e2e-logs.txt
          if-no-files-found: warn
          retention-days: 7
