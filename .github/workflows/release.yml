name: Release

# Repository variable LLMMBC_ENABLE_MACOS (default: unset/false)
# -------------------------------------------------------------------
# Set it to "true" only when macOS runners are available for this repository
# (public repo or paid private-repo minutes). When unset/false, the macOS
# engine/CLI/app jobs and the iOS job are not scheduled at all, and the rest of
# the release still publishes Linux/Windows/Android artifacts. Release notes
# list both included and skipped platforms.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Version / tag metadata and optional-stream detection shared by all jobs.
  # Job-level `if` cannot call hashFiles(), hence the outputs below.
  # ---------------------------------------------------------------------------
  meta:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      has_engine: ${{ steps.version.outputs.has_engine }}
      has_core: ${{ steps.version.outputs.has_core }}
      has_app: ${{ steps.version.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=""
          if [ -f packages/llmmbc_core/pubspec.yaml ]; then
            version=$(awk '/^version:/{print $2; exit}' packages/llmmbc_core/pubspec.yaml)
            version=${version%%+*}
          fi
          version=${version:-0.1.0}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            prerelease=false
          else
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
            prerelease=true
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "has_engine=$([ -f scripts/fetch_engine.sh ] && echo true || echo false)"
            echo "has_core=$([ -f packages/llmmbc_core/pubspec.yaml ] && echo true || echo false)"
            echo "has_app=$([ -f app/pubspec.yaml ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag} (prerelease=${prerelease})"

  # ---------------------------------------------------------------------------
  # A file-existence check is not enough: bin/llmmbc_node.dart exists on main as
  # a contract stub that only throws. Every CLI/image job is gated on this smoke
  # test actually producing HardwareProfile JSON (issue #12).
  # ---------------------------------------------------------------------------
  cli-smoke:
    name: CLI smoke test
    needs: meta
    if: needs.meta.outputs.has_core == 'true'
    runs-on: ubuntu-24.04
    outputs:
      working: ${{ steps.smoke.outputs.working }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Smoke-test llmmbc_node hw
        id: smoke
        shell: bash
        working-directory: packages/llmmbc_core
        run: |
          set -euo pipefail
          if [ ! -f bin/llmmbc_node.dart ]; then
            echo "working=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Headless CLI missing; skipping CLI, Docker and release publication"
            exit 0
          fi
          dart pub get
          if ! out=$(dart run bin/llmmbc_node.dart hw); then
            echo "working=false" >> "$GITHUB_OUTPUT"
            echo "::notice::llmmbc_node is not functional yet (hw exited non-zero); skipping CLI and Docker"
            exit 0
          fi
          printf '%s\n' "${out}"
          if [[ "${out}" != \{* ]] || ! grep -q '"totalRamBytes"' <<<"${out}"; then
            echo "working=false" >> "$GITHUB_OUTPUT"
            echo "::notice::llmmbc_node hw did not print HardwareProfile JSON; skipping CLI and Docker"
            exit 0
          fi
          echo "working=true" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # llama.cpp engine binaries. Cached by LLAMA_CPP_VERSION.
  # macOS lives in its own optional job so an unavailable macOS runner can
  # never cancel this matrix or skip the Linux/Windows/Android jobs (#50).
  # ---------------------------------------------------------------------------
  engine:
    name: Engine ${{ matrix.target }}
    needs: meta
    if: needs.meta.outputs.has_engine == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-x64
            os: windows-2022
          - target: android-arm64
            os: ubuntu-24.04
          - target: android-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read LLAMA_CPP_VERSION
        id: llama
        shell: bash
        run: |
          if [ -f native/LLAMA_CPP_VERSION ]; then
            value=$(tr -d '[:space:]' < native/LLAMA_CPP_VERSION)
          else
            value=unpinned
            echo "::notice::native/LLAMA_CPP_VERSION is missing; engine cache key is not pinned"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"
      - name: Cache engine build
        id: cache
        uses: actions/cache@v4
        with:
          path: engine-out/${{ matrix.target }}
          key: engine-${{ matrix.target }}-${{ steps.llama.outputs.value }}-${{ hashFiles('scripts/build_engine.sh', 'scripts/fetch_engine.sh') }}
      - name: Export Android NDK location
        if: startsWith(matrix.target, 'android')
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "${sdk}/ndk" ]; then
            ndk_name=$(find "${sdk}/ndk" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
            ndk_dir="${sdk}/ndk/${ndk_name}"
            echo "ANDROID_NDK_HOME=${ndk_dir}" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=${ndk_dir}" >> "$GITHUB_ENV"
          else
            echo "::notice::No Android NDK found; fetch_engine.sh must use its own toolchain for ${{ matrix.target }}"
          fi
      - name: Fetch engine
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          set -euo pipefail
          mkdir -p "engine-out/${TARGET}"
          if [ ! -f scripts/fetch_engine.sh ]; then
            echo "::error::scripts/fetch_engine.sh is missing"
            exit 1
          fi
          bash scripts/fetch_engine.sh "${TARGET}" "engine-out/${TARGET}"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: engine-out/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Optional macOS engine (LLMMBC_ENABLE_MACOS == 'true'). Split out so a
  # cancelled macOS runner does not cancel the main engine matrix above.
  # ---------------------------------------------------------------------------
  engine-macos:
    name: Engine macos-arm64 (optional)
    needs: meta
    if: vars.LLMMBC_ENABLE_MACOS == 'true' && needs.meta.outputs.has_engine == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Read LLAMA_CPP_VERSION
        id: llama
        shell: bash
        run: |
          if [ -f native/LLAMA_CPP_VERSION ]; then
            value=$(tr -d '[:space:]' < native/LLAMA_CPP_VERSION)
          else
            value=unpinned
            echo "::notice::native/LLAMA_CPP_VERSION is missing; engine cache key is not pinned"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"
      - name: Cache engine build
        id: cache
        uses: actions/cache@v4
        with:
          path: engine-out/macos-arm64
          key: engine-macos-arm64-${{ steps.llama.outputs.value }}-${{ hashFiles('scripts/build_engine.sh', 'scripts/fetch_engine.sh') }}
      - name: Fetch engine
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TARGET: macos-arm64
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          set -euo pipefail
          mkdir -p "engine-out/${TARGET}"
          bash scripts/fetch_engine.sh "${TARGET}" "engine-out/${TARGET}"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-macos-arm64
          path: engine-out/macos-arm64
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Headless CLI (`dart compile exe`) bundled with the matching engine.
  # `always() && !cancelled()` keeps each target independent of the engine
  # matrix result; a missing artifact skips only that target (issue #50).
  # ---------------------------------------------------------------------------
  cli:
    name: Node CLI ${{ matrix.target }}
    needs: [meta, engine, cli-smoke]
    if: >-
      always() && !cancelled() &&
      needs.meta.outputs.has_engine == 'true' && needs.cli-smoke.outputs.working == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download engine
        id: engine
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: engine-dist
      - name: Notice missing engine
        if: steps.engine.outcome != 'success'
        shell: bash
        run: echo "::notice::engine-${{ matrix.target }} was not produced; skipping the ${{ matrix.target }} CLI bundle"
      - uses: dart-lang/setup-dart@v1
        if: steps.engine.outcome == 'success'
        with:
          sdk: stable
      - name: Compile llmmbc_node
        if: steps.engine.outcome == 'success'
        shell: bash
        working-directory: packages/llmmbc_core
        run: |
          set -euo pipefail
          dart pub get
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            dart compile exe bin/llmmbc_node.dart -o "${GITHUB_WORKSPACE}/dist/llmmbc_node.exe"
          else
            dart compile exe bin/llmmbc_node.dart -o "${GITHUB_WORKSPACE}/dist/llmmbc_node"
          fi
      - name: Package (unix)
        if: steps.engine.outcome == 'success' && runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="llmmbc-node-${TARGET}"
          mkdir -p "pkg/${name}/engine"
          cp dist/llmmbc_node "pkg/${name}/llmmbc_node"
          chmod 0755 "pkg/${name}/llmmbc_node"
          cp -a engine-dist/. "pkg/${name}/engine/"
          tar -czf "${name}.tar.gz" -C pkg "${name}"
      - name: Package (windows)
        if: steps.engine.outcome == 'success' && runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $name = "llmmbc-node-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "pkg/$name/engine" | Out-Null
          Copy-Item "dist/llmmbc_node.exe" "pkg/$name/llmmbc_node.exe"
          Copy-Item "engine-dist/*" "pkg/$name/engine/" -Recurse
          Compress-Archive -Path "pkg/$name/*" -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        if: steps.engine.outcome == 'success'
        with:
          name: llmmbc-node-${{ matrix.target }}
          path: |
            llmmbc-node-${{ matrix.target }}.tar.gz
            llmmbc-node-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  cli-macos:
    name: Node CLI macos-arm64 (optional)
    needs: [meta, engine-macos, cli-smoke]
    if: >-
      vars.LLMMBC_ENABLE_MACOS == 'true' && always() && !cancelled() &&
      needs.meta.outputs.has_engine == 'true' && needs.cli-smoke.outputs.working == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download engine
        id: engine
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: engine-macos-arm64
          path: engine-dist
      - name: Notice missing engine
        if: steps.engine.outcome != 'success'
        shell: bash
        run: echo "::notice::engine-macos-arm64 was not produced; skipping the macOS CLI bundle"
      - uses: dart-lang/setup-dart@v1
        if: steps.engine.outcome == 'success'
        with:
          sdk: stable
      - name: Compile llmmbc_node
        if: steps.engine.outcome == 'success'
        shell: bash
        working-directory: packages/llmmbc_core
        run: |
          set -euo pipefail
          dart pub get
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          dart compile exe bin/llmmbc_node.dart -o "${GITHUB_WORKSPACE}/dist/llmmbc_node"
      - name: Package
        if: steps.engine.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          name="llmmbc-node-macos-arm64"
          mkdir -p "pkg/${name}/engine"
          cp dist/llmmbc_node "pkg/${name}/llmmbc_node"
          chmod 0755 "pkg/${name}/llmmbc_node"
          cp -a engine-dist/. "pkg/${name}/engine/"
          tar -czf "${name}.tar.gz" -C pkg "${name}"
      - uses: actions/upload-artifact@v4
        if: steps.engine.outcome == 'success'
        with:
          name: llmmbc-node-macos-arm64
          path: llmmbc-node-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Flutter app bundles, one job per platform. Each job survives a cancelled or
  # failed engine leg and skips only when its own engine artifact is missing.
  # ---------------------------------------------------------------------------
  app-android:
    name: Android APK
    needs: [meta, engine]
    if: always() && !cancelled() && needs.meta.outputs.has_app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download android-arm64 engine
        id: engine_arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: engine-android-arm64
          path: engine/android-arm64
      - name: Download android-x64 engine
        id: engine_x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: engine-android-x64
          path: engine/android-x64
      - name: Notice missing engines
        if: steps.engine_arm64.outcome != 'success' || steps.engine_x64.outcome != 'success'
        shell: bash
        run: echo "::notice::Android engine artifacts are incomplete; skipping the APK"
      - uses: actions/setup-java@v4
        if: steps.engine_arm64.outcome == 'success' && steps.engine_x64.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: steps.engine_arm64.outcome == 'success' && steps.engine_x64.outcome == 'success'
        with:
          channel: stable
          cache: true
      - name: Install engine native libraries
        if: steps.engine_arm64.outcome == 'success' && steps.engine_x64.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          copy_engine() {
            src=$1
            abi=$2
            dst="app/android/app/src/main/jniLibs/${abi}"
            mkdir -p "${dst}"
            for f in "${src}/llama-server" "${src}/libllama_server.so"; do
              if [ -f "${f}" ]; then cp "${f}" "${dst}/libllama_server.so"; break; fi
            done
            for f in "${src}/rpc-server" "${src}/librpc_server.so"; do
              if [ -f "${f}" ]; then cp "${f}" "${dst}/librpc_server.so"; break; fi
            done
            find "${src}" -maxdepth 1 -name 'lib*.so' -exec cp {} "${dst}/" \;
          }
          copy_engine engine/android-arm64 arm64-v8a
          copy_engine engine/android-x64 x86_64
          for abi in arm64-v8a x86_64; do
            dst="app/android/app/src/main/jniLibs/${abi}"
            for lib in libllama_server.so librpc_server.so; do
              if [ ! -f "${dst}/${lib}" ]; then
                echo "::error::Missing ${lib} for ${abi} after engine install"
                ls -la "${dst}" || true
                exit 1
              fi
            done
          done
      - name: Build release APK (debug-signed when no keystore secret is configured)
        if: steps.engine_arm64.outcome == 'success' && steps.engine_x64.outcome == 'success'
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Collect APK
        if: steps.engine_arm64.outcome == 'success' && steps.engine_x64.outcome == 'success'
        shell: bash
        run: cp app/build/app/outputs/flutter-apk/app-release.apk llmmbc-android.apk
      - uses: actions/upload-artifact@v4
        if: steps.engine_arm64.outcome == 'success' && steps.engine_x64.outcome == 'success'
        with:
          name: llmmbc-app-android
          path: llmmbc-android.apk
          if-no-files-found: error
          retention-days: 7

  app-linux:
    name: Linux bundle
    needs: [meta, engine]
    if: always() && !cancelled() && needs.meta.outputs.has_app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download engine
        id: engine
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: engine-linux-x64
          path: engine-dist
      - name: Notice missing engine
        if: steps.engine.outcome != 'success'
        shell: bash
        run: echo "::notice::engine-linux-x64 was not produced; skipping the Linux bundle"
      - uses: subosito/flutter-action@v2
        if: steps.engine.outcome == 'success'
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        if: steps.engine.outcome == 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build Linux bundle
        if: steps.engine.outcome == 'success'
        working-directory: app
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release
      - name: Bundle engine and archive
        if: steps.engine.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          bundle=app/build/linux/x64/release/bundle
          mkdir -p "${bundle}/engine"
          cp -a engine-dist/. "${bundle}/engine/"
          for bin in llama-server rpc-server; do
            if [ ! -x "${bundle}/engine/${bin}" ]; then
              echo "::error::Missing executable engine/${bin} in the Linux bundle"
              exit 1
            fi
          done
          tar -czf llmmbc-app-linux-x64.tar.gz -C "${bundle}" .
      - uses: actions/upload-artifact@v4
        if: steps.engine.outcome == 'success'
        with:
          name: llmmbc-app-linux-x64
          path: llmmbc-app-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  app-windows:
    name: Windows bundle
    needs: [meta, engine]
    if: always() && !cancelled() && needs.meta.outputs.has_app == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download engine
        id: engine
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: engine-windows-x64
          path: engine-dist
      - name: Notice missing engine
        if: steps.engine.outcome != 'success'
        shell: bash
        run: echo "::notice::engine-windows-x64 was not produced; skipping the Windows bundle"
      - uses: subosito/flutter-action@v2
        if: steps.engine.outcome == 'success'
        with:
          channel: stable
          cache: true
      - name: Build Windows bundle
        if: steps.engine.outcome == 'success'
        working-directory: app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
      - name: Bundle engine and archive
        if: steps.engine.outcome == 'success'
        shell: pwsh
        run: |
          $bundle = "app/build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "$bundle/engine" | Out-Null
          Copy-Item "engine-dist/*" "$bundle/engine/" -Recurse
          foreach ($bin in @("llama-server.exe", "rpc-server.exe")) {
            if (-not (Test-Path "$bundle/engine/$bin")) { throw "Missing engine/$bin in the Windows bundle" }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath "llmmbc-app-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        if: steps.engine.outcome == 'success'
        with:
          name: llmmbc-app-windows-x64
          path: llmmbc-app-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  app-macos:
    name: macOS bundle (optional)
    needs: [meta, engine-macos]
    if: vars.LLMMBC_ENABLE_MACOS == 'true' && always() && !cancelled() && needs.meta.outputs.has_app == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download engine
        id: engine
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: engine-macos-arm64
          path: engine-dist
      - name: Notice missing engine
        if: steps.engine.outcome != 'success'
        shell: bash
        run: echo "::notice::engine-macos-arm64 was not produced; skipping the macOS bundle"
      - uses: subosito/flutter-action@v2
        if: steps.engine.outcome == 'success'
        with:
          channel: stable
          cache: true
      - name: Build macOS app
        if: steps.engine.outcome == 'success'
        working-directory: app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
      - name: Bundle engine and archive
        if: steps.engine.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find app/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "${app}" ]; then
            echo "::error::No macOS .app bundle produced"
            exit 1
          fi
          mkdir -p "${app}/Contents/MacOS/engine"
          cp -a engine-dist/. "${app}/Contents/MacOS/engine/"
          for bin in llama-server rpc-server; do
            if [ ! -x "${app}/Contents/MacOS/engine/${bin}" ]; then
              echo "::error::Missing executable Contents/MacOS/engine/${bin} in the macOS bundle"
              exit 1
            fi
          done
          ditto -c -k --keepParent "${app}" llmmbc-app-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        if: steps.engine.outcome == 'success'
        with:
          name: llmmbc-app-macos-arm64
          path: llmmbc-app-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  app-ios:
    name: iOS unsigned (optional)
    needs: meta
    if: vars.LLMMBC_ENABLE_MACOS == 'true' && needs.meta.outputs.has_app == 'true'
    runs-on: macos-14
    # Optional per the delivery spec: an unsigned build failure must not block a release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS (no codesign)
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package unsigned app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find app/build/ios/iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "${app}" ]; then
            echo "::error::No iOS .app bundle produced"
            exit 1
          fi
          ditto -c -k --keepParent "${app}" llmmbc-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: llmmbc-app-ios-unsigned
          path: llmmbc-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Headless node container image -> GHCR.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image (GHCR)
    needs: [meta, cli-smoke]
    if: needs.meta.outputs.has_engine == 'true' && needs.cli-smoke.outputs.working == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llmmbc-node"
          tags=(-t "${image}:${VERSION}")
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags+=(-t "${image}:latest")
          fi
          docker buildx build \
            --push \
            --platform linux/amd64 \
            --file docker/Dockerfile \
            "${tags[@]}" \
            .

  # ---------------------------------------------------------------------------
  # GitHub Release. Publishes whenever at least one llmmbc-* artifact exists,
  # even if some platform jobs were skipped, failed or cancelled (#50). Release
  # notes list included and skipped platforms.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [meta, cli-smoke, engine, engine-macos, cli, cli-macos, app-android, app-linux, app-windows, app-macos, app-ios, docker]
    if: always() && !cancelled() && needs.meta.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: llmmbc-*
          merge-multiple: true
      - name: Build release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          ENABLE_MACOS: ${{ vars.LLMMBC_ENABLE_MACOS }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t files < <(find dist -type f -printf '%f\n' | sort)
          count=${#files[@]}
          echo "found ${count} release artifact file(s)"
          if ((count > 0)); then
            printf '  %s\n' "${files[@]}"
          fi

          entries=(
            "Headless CLI — linux-x64|llmmbc-node-linux-x64.tar.gz"
            "Headless CLI — linux-arm64|llmmbc-node-linux-arm64.tar.gz"
            "Headless CLI — windows-x64|llmmbc-node-windows-x64.zip"
            "Android APK (arm64-v8a + x86_64)|llmmbc-android.apk"
            "Linux app bundle (linux-x64)|llmmbc-app-linux-x64.tar.gz"
            "Windows app bundle (windows-x64)|llmmbc-app-windows-x64.zip"
          )
          macos_entries=(
            "Headless CLI — macOS arm64|llmmbc-node-macos-arm64.tar.gz"
            "macOS app bundle (arm64)|llmmbc-app-macos-arm64.zip"
            "iOS unsigned app|llmmbc-ios-unsigned.zip"
          )
          included=()
          skipped=()
          for entry in "${entries[@]}" "${macos_entries[@]}"; do
            label=${entry%%|*}
            file=${entry##*|}
            if [[ -f "dist/${file}" ]]; then
              included+=("${label}")
            else
              skipped+=("${label}")
            fi
          done

          {
            echo "## LLMMBC ${TAG}"
            echo
            echo "### Included platforms"
            if ((${#included[@]})); then
              printf -- '- %s\n' "${included[@]}"
            else
              echo "_None._"
            fi
            echo
            echo "### Skipped platforms"
            if ((${#skipped[@]})); then
              printf -- '- %s\n' "${skipped[@]}"
            else
              echo "_None._"
            fi
            if [[ "${ENABLE_MACOS}" != "true" ]]; then
              echo
              echo "> macOS and unsigned iOS builds are disabled (LLMMBC_ENABLE_MACOS is not true)."
            fi
            echo
            echo "### Assets"
            if ((count > 0)); then
              printf -- '- %s\n' "${files[@]}"
            else
              echo "_None._"
            fi
          } > release-notes.md
          cat release-notes.md

          if ((count == 0)); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No artifacts available; skipping release publication"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
